// Native inference wire contract for local Agent execution.
syntax = "proto3";
package aiserver.v1;

import "agent_v1.proto";
import "aiserver_v1_shared.proto";
import "google/protobuf/struct.proto";

message RunInferenceClientMessage {
  oneof message {
    .aiserver.v1.RunInferenceRunRequest run_request = 1;
    .aiserver.v1.RunInferenceInvokeModel invoke_model = 2;
    .aiserver.v1.RunInferenceCancelInvocation cancel_invocation = 3;
    .aiserver.v1.RunInferenceFinishRun finish_run = 4;
    .aiserver.v1.RunInferenceClientHeartbeat client_heartbeat = 5;
    .aiserver.v1.RunInferenceAgentEvent agent_event = 6;
    .aiserver.v1.RunInferenceRunRequestLog run_request_log = 7;
    .aiserver.v1.RunInferenceResolveSubagentModels resolve_subagent_models = 9;
  }
}

message RunInferenceRunRequest {
  string conversation_id = 1;
  optional string conversation_group_id = 2;
  .aiserver.v1.InferenceRequestedModel requested_model = 3;
  repeated .aiserver.v1.RunInferenceRoutingMessage routing_conversation = 4;
  optional string agent_mode = 5;
  optional string subagent_type_name = 6;
  repeated .aiserver.v1.InferenceRequestedModel selected_subagent_models = 7;
  repeated .aiserver.v1.RunInferenceSubagentModelOverride subagent_model_overrides = 8;
  optional bool is_summarize_action = 9;
  bool supports_long_reasoning_reminder = 10;
  optional .aiserver.v1.RunInferenceAgentModule agent_module = 11;
  optional string previous_request_id = 12;
  optional .aiserver.v1.RunInferenceExecutePlan execute_plan = 15;
  optional string turn_agent_mode = 16;
  bool supports_agent_loop_error = 17;
}

message InferenceRequestedModel {
  string model_id = 1;
  bool max_mode = 2;
  repeated .aiserver.v1.InferenceModelParameterValue parameters = 3;
  bool built_in_model = 4;
}

message InferenceModelParameterValue {
  string id = 1;
  string value = 2;
}

message RunInferenceRoutingMessage {
  .aiserver.v1.RunInferenceRoutingRole role = 1;
  string text = 2;
}

message RunInferenceSubagentModelOverride {
  string subagent_type = 1;
  oneof selection {
    .aiserver.v1.InferenceRequestedModel model = 2;
    bool inherit = 3;
    bool disabled = 4;
  }
}

message RunInferenceAgentModule {
  string generation = 1;
  .aiserver.v1.RunInferenceAgentModuleSource source = 2;
  string channel = 3;
  optional string commit = 4;
  uint32 interface_revision = 5;
  repeated string prompt_versions = 6;
}

message RunInferenceExecutePlan {
  optional string plan_file_uri = 1;
  optional string plan_file_content = 2;
}

message RunInferenceInvokeModel {
  string invocation_id = 1;
  .aiserver.v1.InferenceStreamRequest request = 2;
  .aiserver.v1.RunInferenceInvocationPurpose purpose = 3;
  repeated .aiserver.v1.RunInferenceToolCallBatch tool_call_batches = 4;
}

message InferenceStreamRequest {
  repeated .aiserver.v1.InferenceCoreMessage messages = 1;
  repeated .aiserver.v1.InferenceAgentTool tools = 2;
  repeated .aiserver.v1.InferenceNamedProviderDefinedTool provider_defined_tools = 3;
  optional .aiserver.v1.InferenceModelConfig model_config = 4;
  optional string model_id = 5;
  optional string invocation_id = 6;
  optional .aiserver.v1.InferenceRequestedModel requested_model = 7;
  optional string conversation_id = 8;
  repeated string accepted_unadvertised_tool_names = 9;
  optional string automation_id = 10;
  optional .aiserver.v1.InferenceReason inference_reason = 11;
  optional string conversation_group_id = 12;
  optional string parent_request_id = 13;
  optional string root_parent_request_id = 14;
  optional string parent_agent_tool_call_id = 15;
  optional string subagent_type = 16;
  optional int32 compaction_epoch = 17;
  optional string turn_unit_id = 18;
  optional string turn_unit_type = 19;
  optional string originating_flow = 20;
  optional string routing_reason = 21;
  optional int32 summarized_message_count = 22;
  optional bool is_simulated_msg = 23;
  optional int32 simulated_msg_reason = 24;
}

message InferenceCoreMessage {
  .aiserver.v1.InferenceMessageRole role = 1;
  repeated .aiserver.v1.InferenceToolCall tool_calls = 4;
  repeated .aiserver.v1.InferenceReasoningPart reasoning_parts = 7;
  optional string model_provider_message_id = 8;
  optional string openai_phase = 9;
  optional bool openai_phase_null = 10;
  optional string cursor_inference_reason = 11;
  optional string cursor_feature_type = 12;
  optional bool cursor_is_summary = 13;
  optional string cursor_clear_at = 14;
  optional string cursor_fallback_insert_before = 15;
  repeated .aiserver.v1.InferenceAssistantPartKind assistant_part_order = 16;
  repeated string assistant_text_parts = 17;
  optional string anthropic_native_content = 18;
  optional string lineage_tag = 19;
  optional string cursor_request_id = 20;
  oneof content {
    string text = 2;
    .aiserver.v1.InferenceContentParts parts = 3;
    .aiserver.v1.InferenceToolResultContent tool_content = 6;
  }
}

message InferenceContentParts {
  repeated .aiserver.v1.InferenceContentPart parts = 1;
}

message InferenceContentPart {
  oneof part {
    .aiserver.v1.InferenceTextPart text = 1;
    .aiserver.v1.InferenceImagePart image = 2;
    .aiserver.v1.InferenceFilePart file = 3;
  }
}

message InferenceTextPart {
  string text = 1;
  optional .aiserver.v1.InferenceProviderOptions provider_options = 2;
}

message InferenceProviderOptions {
  optional .aiserver.v1.InferenceAnthropicOptions anthropic = 1;
  optional .aiserver.v1.InferenceCursorOptions cursor = 2;
}

message InferenceAnthropicOptions {
  optional .aiserver.v1.InferenceCacheControl cache_control = 1;
}

message InferenceCacheControl {
  string type = 1;
}

message InferenceCursorOptions {
  optional string image_description = 1;
  map<int32, string> image_descriptions = 2;
  optional string image_content_sha256 = 3;
}

message InferenceImagePart {
  string data = 1;
  optional string mime_type = 2;
  optional .aiserver.v1.InferenceProviderOptions provider_options = 3;
}

message InferenceFilePart {
  string data = 1;
  string media_type = 2;
  optional string filename = 3;
  optional .aiserver.v1.InferenceProviderOptions provider_options = 4;
}

message InferenceToolResultContent {
  repeated .aiserver.v1.InferenceToolResultPart parts = 1;
}

message InferenceToolResultPart {
  string tool_call_id = 1;
  string tool_name = 2;
  .google.protobuf.Value result = 3;
  bool is_error = 4;
  repeated .aiserver.v1.InferenceContentPart experimental_content = 5;
  optional .aiserver.v1.InferenceProviderOptions provider_options = 6;
  optional bool cursor_tool_call_is_error = 7;
}

message InferenceToolCall {
  string tool_call_id = 1;
  string tool_name = 2;
  .google.protobuf.Struct args = 3;
  optional string raw_tool_call_args = 4;
}

message InferenceReasoningPart {
  bool is_redacted = 1;
  string text = 2;
  optional string signature = 3;
  optional string redacted_data = 4;
  optional string model_name = 5;
  optional string lineage_tag = 6;
}

message InferenceAgentTool {
  string name = 1;
  string description = 2;
  .google.protobuf.Struct parameters = 3;
  optional .aiserver.v1.InferenceCustomToolFormat custom_tool_format = 4;
}

message InferenceCustomToolFormat {
  string type = 1;
  string definition = 2;
  string syntax = 3;
}

message InferenceNamedProviderDefinedTool {
  string name = 1;
  string id = 2;
  string type = 3;
  .google.protobuf.Struct options = 4;
}

message InferenceModelConfig {
  optional int32 max_tokens = 1;
  optional float temperature = 2;
  optional float top_p = 3;
  repeated string stop_sequences = 4;
  optional int32 top_k = 5;
  optional .google.protobuf.Struct chat_template_kwargs = 6;
  optional bool continue_final_message = 7;
}

message RunInferenceToolCallBatch {
  optional string invocation_id = 1;
  repeated .aiserver.v1.RunInferenceToolCallEvent tool_calls = 2;
}

message RunInferenceToolCallEvent {
  string tool_call_id = 1;
  string tool_identifier = 2;
  int64 started_at_ms = 3;
  int64 ended_at_ms = 4;
  bool success = 5;
  optional string error_class = 6;
  optional string error_classification = 7;
  optional uint32 result_chars = 8;
  optional uint32 result_images = 9;
}

message RunInferenceCancelInvocation {
  string invocation_id = 1;
}

message RunInferenceFinishRun {
  bool aborted = 1;
  optional bool turn_completed = 2;
  repeated .aiserver.v1.RunInferenceToolCallBatch tool_call_batches = 3;
}

message RunInferenceClientHeartbeat {
}

message RunInferenceAgentEvent {
  string method_name = 1;
  string options_json = 2;
  optional int64 client_reported_at_ms = 3;
}

message RunInferenceRunRequestLog {
  bytes agent_run_request = 1;
}

message RunInferenceResolveSubagentModels {
  string resolution_id = 1;
  repeated string requested_models = 2;
}

message RunInferenceServerMessage {
  oneof message {
    .aiserver.v1.RunInferenceHeartbeat heartbeat = 1;
    .aiserver.v1.RunInferenceRunReady run_ready = 2;
    .aiserver.v1.RunInferenceInvocationResponse invocation_response = 3;
    .aiserver.v1.RunInferenceInvocationEnd invocation_end = 4;
    .aiserver.v1.RunInferenceSubagentModelsResolved subagent_models_resolved = 5;
  }
}

message RunInferenceHeartbeat {
}

message RunInferenceRunReady {
  .aiserver.v1.InferenceRequestedModel resolved_model = 1;
  bool supports_self_summary = 2;
  optional string routed_model_display_name = 3;
  .aiserver.v1.RunInferencePromptModelMetadata prompt_model_metadata = 4;
  .aiserver.v1.RunInferenceSummarizationConfig summarization = 5;
  repeated .agent.v1.CursorRule non_file_rules = 6;
  bool accepts_client_heartbeat = 7;
  bool accepts_agent_events = 8;
  bool agent_run_request_log_requested = 10;
  bool kv_blob_telemetry_enabled = 9;
  bool accepts_aborted_finish = 13;
  map<string, string> metric_labels = 12;
  bool accepts_subagent_model_resolution = 14;
  bool accepts_tool_call_events = 15;
}

message RunInferencePromptModelMetadata {
  string vendor = 1;
  string prompt_version = 2;
  bool is_sonnet45 = 3;
  bool is_gemini3 = 4;
  bool is_gpt51 = 5;
  bool is_gpt52 = 6;
  bool is_gpt5 = 7;
  bool is_gpt55 = 8;
  bool is_gpt56 = 9;
  bool is_sonnet4 = 10;
  bool is_codex_family = 11;
  bool is_gpt54 = 12;
  bool is_gpt52_codex = 13;
  bool is_gpt53_codex = 14;
  bool is_gpt53_codex_spark = 15;
  bool is_claude_4x = 16;
  bool is_opus45 = 17;
  bool is_opus46 = 18;
  bool is_opus48 = 19;
  bool is_opus5 = 20;
  bool is_opus55 = 50;
  bool is_fable5 = 21;
  bool is_fable51 = 43;
  bool is_fruitcake = 22;
  bool is_gpt5_family = 23;
  bool is_composer1 = 24;
  bool is_composer15 = 25;
  bool is_composer2 = 26;
  bool is_composer_matterhorn = 27;
  bool is_grok45_product_prompt = 28;
  bool is_raw_training_slug = 29;
  bool is_grok46_product_prompt = 34;
  optional string reasoning_effort = 30;
  bool use_dsv3_harness = 31;
  optional int32 agent_token_limit = 32;
  optional int32 estimated_cache_ttl_ms = 33;
  string persona = 35;
  map<string, .aiserver.v1.RunInferenceFlagValue> feature_flags = 36;
  optional .aiserver.v1.RunInferenceLoopNudgeConfig loop_nudge = 37;
  optional int32 progress_reminder_threshold = 38;
  optional string effort_level = 39;
  bool supports_assistant_message_prefill = 40;
  bool enable_line_numbers = 41;
  bool use_sparse_read_line_numbers = 42;
  string self_identity_name = 44;
  optional bool dsv3_is_thinking = 45;
  repeated .aiserver.v1.RunInferenceAgentModeConfig agent_mode_configs = 46;
  optional bool use_new_plan_mode_prompts = 47;
  optional .aiserver.v1.RunInferenceAskQuestionConfig ask_question_config = 48;
  optional .aiserver.v1.RunInferenceSubagentModelConfig subagent_model_config = 49;
  repeated .aiserver.v1.RunInferencePostToolReminder post_tool_reminders = 51;
  optional bool enable_semantic_search = 52;
  optional .aiserver.v1.RunInferenceLongReasoningReminderConfig long_reasoning_reminder = 53;
  optional bool smart_mode_classifier_mode = 54;
  optional bool smart_mode_classifier_shadow_mode = 55;
}

message RunInferenceFlagValue {
  oneof value {
    bool bool_value = 1;
    double number_value = 2;
    string string_value = 3;
  }
}

message RunInferenceLoopNudgeConfig {
  int32 min_repetitions = 1;
  int32 min_message_length = 2;
  bool inject_reminder = 3;
}

message RunInferenceAgentModeConfig {
  string mode_id = 1;
  bool enable_ask_question_tool = 2;
  optional .aiserver.v1.RunInferenceSwitchModeToolConfig switch_mode_tool_config = 3;
}

message RunInferenceSwitchModeToolConfig {
  repeated string target_modes = 1;
}

message RunInferenceAskQuestionConfig {
  string tool_name = 1;
  bool auto_reject_first = 2;
}

message RunInferenceSubagentModelConfig {
  string force_policy = 1;
  optional string force_model_id = 2;
  bool parent_max_mode = 3;
  repeated .aiserver.v1.RunInferenceSubagentModelPolicy models = 4;
  repeated .aiserver.v1.RunInferenceResolvedSubagentModelOverride overrides = 5;
  bool task_tool_omitted = 6;
  string parent_requested_model_name = 7;
}

message RunInferenceSubagentModelPolicy {
  string slug = 1;
  bool advertised = 2;
  bool valid = 3;
  bool blocked = 4;
  bool requires_max_mode = 5;
  double representative_cost_dollars = 6;
  repeated string legacy_aliases = 7;
}

message RunInferenceResolvedSubagentModelOverride {
  string subagent_type = 1;
  string kind = 2;
  optional string model_id = 3;
}

message RunInferencePostToolReminder {
  string id = 1;
  optional uint32 interval_tool_calls = 2;
}

message RunInferenceLongReasoningReminderConfig {
  string arm = 1;
  bool enabled = 2;
  uint32 threshold_tokens = 3;
  uint32 delay_calls = 4;
  string reminder_text = 5;
}

message RunInferenceSummarizationConfig {
  .aiserver.v1.InferenceRequestedModel model = 1;
  bool is_fallback_to_main_model = 2;
  int32 max_prompt_chars = 3;
  .aiserver.v1.RunInferenceBackgroundSummarizationConfig background = 4;
}

message RunInferenceBackgroundSummarizationConfig {
  optional int32 unused_tokens_threshold_to_start = 1;
  optional double unused_percent_tokens_threshold_to_start = 2;
  optional int32 unused_tokens_threshold_to_persist = 3;
  optional double unused_percent_tokens_threshold_to_persist = 4;
  bool require_trigger_threshold_for_mid_loop_persist = 5;
  bool discard_on_error = 6;
}

message RunInferenceInvocationResponse {
  string invocation_id = 1;
  .aiserver.v1.InferenceStreamResponse response = 2;
}

message InferenceStreamResponse {
  oneof response {
    .aiserver.v1.InferenceTextStreamPart text_part = 1;
    .aiserver.v1.InferenceToolCallStreamPart tool_call_part = 2;
    .aiserver.v1.InferenceUsageInfo usage = 3;
    .aiserver.v1.InferenceResponseInfo response_info = 4;
    .aiserver.v1.InferenceExtendedUsageInfo extended_usage = 5;
    .aiserver.v1.InferenceProviderMetadataInfo provider_metadata = 6;
    .aiserver.v1.InferenceInvocationIdInfo invocation_id = 7;
    .aiserver.v1.InferenceStreamError error = 8;
    .aiserver.v1.InferenceThinkingStreamPart thinking_part = 9;
    .aiserver.v1.InferenceImageDescriptionsInfo image_descriptions = 10;
    .aiserver.v1.InferenceLineageTagsInfo lineage_tags = 11;
  }
}

message InferenceTextStreamPart {
  string text = 1;
  bool is_final = 2;
}

message InferenceToolCallStreamPart {
  string tool_call_id = 1;
  string tool_name = 2;
  string args = 3;
  bool is_complete = 4;
  optional int32 tool_index = 5;
  optional string call_signature = 6;
}

message InferenceUsageInfo {
  int32 prompt_tokens = 1;
  int32 completion_tokens = 2;
  optional int32 total_tokens = 3;
}

message InferenceResponseInfo {
  string id = 1;
  string model = 2;
  int64 created_at = 3;
  repeated .aiserver.v1.InferenceResponseMessage messages = 4;
  optional string error_message = 5;
  optional .aiserver.v1.InferenceExtraData inference_extra_data = 6;
  optional bool supports_self_summary = 7;
  optional int32 early_compaction_context_token_threshold = 8;
  optional string self_summary_flavor = 9;
}

message InferenceResponseMessage {
  string id = 1;
  .aiserver.v1.InferenceMessageRole role = 2;
  optional string content = 3;
  repeated .aiserver.v1.InferenceToolCall tool_calls = 4;
  optional .aiserver.v1.InferenceToolResultContent tool_result = 5;
  repeated .aiserver.v1.InferenceReasoningPart reasoning_parts = 6;
  optional string model_provider_message_id = 7;
  optional string openai_phase = 8;
  optional bool openai_phase_null = 9;
  repeated .aiserver.v1.InferenceAssistantPartKind assistant_part_order = 10;
  repeated string assistant_text_parts = 11;
  optional string anthropic_native_content = 12;
  optional string lineage_tag = 13;
}

message InferenceExtraData {
  repeated .aiserver.v1.InferenceTokenLogprobs token_logprobs = 1;
  repeated .aiserver.v1.InferenceTokenIds token_ids = 2;
  repeated .aiserver.v1.InferenceTokenIds prompt_token_ids = 3;
  repeated .aiserver.v1.InferenceTokenIds extra_tokens = 4;
  repeated .aiserver.v1.InferenceTokenLogprobs extra_logprobs = 5;
  repeated .aiserver.v1.InferenceRoutingRow routing_matrix = 6;
}

message InferenceTokenLogprobs {
  repeated double values = 1;
}

message InferenceTokenIds {
  repeated int64 values = 1;
}

message InferenceRoutingRow {
  repeated string values = 1;
}

message InferenceExtendedUsageInfo {
  int32 input_tokens = 1;
  int32 output_tokens = 2;
  int32 cache_read_tokens = 3;
  int32 cache_write_tokens = 4;
  int32 max_tokens = 5;
  optional int32 reasoning_tokens = 6;
}

message InferenceProviderMetadataInfo {
  .google.protobuf.Struct metadata = 1;
}

message InferenceInvocationIdInfo {
  string invocation_id = 1;
}

message InferenceStreamError {
  string message = 1;
  string code = 2;
  bool is_input_token_limit_error = 3;
  bool is_output_token_limit_error = 4;
  .aiserver.v1.InferenceStreamErrorType error_type = 5;
}

message InferenceThinkingStreamPart {
  string text = 1;
  optional string signature = 2;
  bool is_final = 3;
  optional bool is_already_summarized = 4;
  optional string model_name = 5;
  optional string redacted_data = 6;
}

message InferenceImageDescriptionsInfo {
  repeated .aiserver.v1.InferenceImageDescription descriptions = 1;
}

message InferenceImageDescription {
  int32 message_index = 1;
  int32 part_index = 2;
  optional int32 exp_content_index = 3;
  string description = 4;
}

message InferenceLineageTagsInfo {
  repeated .aiserver.v1.InferenceLineageTag tags = 1;
}

message InferenceLineageTag {
  int32 message_index = 1;
  string tag = 2;
  repeated string reasoning_tags = 3;
}

message RunInferenceInvocationEnd {
  string invocation_id = 1;
  optional .aiserver.v1.RunInferenceInvocationError error = 2;
}

message RunInferenceInvocationError {
  int32 code = 1;
  string message = 2;
  repeated .aiserver.v1.RunInferenceErrorDetail details = 3;
}

message RunInferenceErrorDetail {
  string type = 1;
  bytes value = 2;
}

message RunInferenceSubagentModelsResolved {
  string resolution_id = 1;
  repeated .aiserver.v1.RunInferenceResolvedSubagentModel models = 2;
}

message RunInferenceResolvedSubagentModel {
  string requested = 1;
  optional string resolved_slug = 2;
}

enum RunInferenceRoutingRole {
  RUN_INFERENCE_ROUTING_ROLE_UNSPECIFIED = 0;
  RUN_INFERENCE_ROUTING_ROLE_USER = 1;
  RUN_INFERENCE_ROUTING_ROLE_ASSISTANT = 2;
}

enum RunInferenceAgentModuleSource {
  RUN_INFERENCE_AGENT_MODULE_SOURCE_UNSPECIFIED = 0;
  RUN_INFERENCE_AGENT_MODULE_SOURCE_STATIC = 1;
  RUN_INFERENCE_AGENT_MODULE_SOURCE_FLOOR = 2;
  RUN_INFERENCE_AGENT_MODULE_SOURCE_INSTALLED = 3;
}

enum InferenceMessageRole {
  INFERENCE_MESSAGE_ROLE_UNSPECIFIED = 0;
  INFERENCE_MESSAGE_ROLE_USER = 1;
  INFERENCE_MESSAGE_ROLE_ASSISTANT = 2;
  INFERENCE_MESSAGE_ROLE_TOOL = 3;
  INFERENCE_MESSAGE_ROLE_SYSTEM = 4;
}

enum InferenceAssistantPartKind {
  INFERENCE_ASSISTANT_PART_KIND_UNSPECIFIED = 0;
  INFERENCE_ASSISTANT_PART_KIND_REASONING = 1;
  INFERENCE_ASSISTANT_PART_KIND_TEXT = 2;
  INFERENCE_ASSISTANT_PART_KIND_TOOL_CALL = 3;
}

enum InferenceReason {
  INFERENCE_REASON_UNSPECIFIED = 0;
  INFERENCE_REASON_GEMINI_VIDEO_SUBAGENT = 1;
  INFERENCE_REASON_GROK_BOT_PROACTIVITY_SUBAGENT = 2;
}

enum RunInferenceInvocationPurpose {
  RUN_INFERENCE_INVOCATION_PURPOSE_UNSPECIFIED = 0;
  RUN_INFERENCE_INVOCATION_PURPOSE_CONTEXT_SUMMARIZATION = 1;
}

enum InferenceStreamErrorType {
  INFERENCE_STREAM_ERROR_TYPE_UNSPECIFIED = 0;
  INFERENCE_STREAM_ERROR_TYPE_UNKNOWN = 1;
  INFERENCE_STREAM_ERROR_TYPE_INPUT_TOKEN_LIMIT = 2;
  INFERENCE_STREAM_ERROR_TYPE_OUTPUT_TOKEN_LIMIT = 3;
  INFERENCE_STREAM_ERROR_TYPE_RATE_LIMIT = 4;
  INFERENCE_STREAM_ERROR_TYPE_AUTHENTICATION = 5;
  INFERENCE_STREAM_ERROR_TYPE_PERMISSION = 6;
  INFERENCE_STREAM_ERROR_TYPE_OVERLOADED = 7;
  INFERENCE_STREAM_ERROR_TYPE_CONTENT_FILTER = 8;
}

service InferenceService {
  rpc Stream(InferenceStreamRequest) returns (stream InferenceStreamResponse);
  rpc RunInference(stream RunInferenceClientMessage) returns (stream RunInferenceServerMessage);
  rpc RunInferenceSSE(BidiRequestId) returns (stream RunInferenceServerMessage);
}
